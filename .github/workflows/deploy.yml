name: Starter App Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version label to deploy.
        required: true
        default: latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deploy image
        run: |
          docker build \
            --build-arg VERSION="${{ inputs.version }}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "starter-app:${{ inputs.version }}" \
            -t "starter-app:latest" .
      - name: Save image to artifacts
        run: docker save "starter-app:${{ inputs.version }}" | gzip > /tmp/starter-app.tar.gz
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/starter-app.tar.gz
          retention-days: 1

  staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp
      - name: Load image
        run: |
          echo "Loading Docker image from artifact..."
          if docker load < /tmp/starter-app.tar.gz; then
            echo "✅ Image loaded successfully"
          else
            echo "❌ Failed to load image"
            exit 1
          fi
          echo "Available images:"
          docker images | grep starter-app || echo "No starter-app images found!"
      - name: Deploy to staging
        run: ./scripts/deploy.sh staging "${{ inputs.version }}"
      - name: Start staging container
        run: |
          docker rm -f starter-app-staging || true
          echo "Starting container with image: starter-app:${{ inputs.version }}"
          echo "Attempting docker run..."
          if docker run -d --rm --name starter-app-staging -p 8000:8000 -e PORT=8000 -e APP_ENV=staging "starter-app:${{ inputs.version }}"; then
            echo "✅ Docker run command succeeded"
            sleep 1
            echo "Checking if container is running..."
            if docker ps | grep -q starter-app-staging; then
              echo "✅ Container is running"
              docker inspect starter-app-staging | grep -A 5 Status
            else
              echo "❌ Container exited immediately"
              docker ps -a | grep starter-app-staging
              docker logs starter-app-staging 2>&1 || echo "No logs available"
              exit 1
            fi
          else
            echo "❌ Docker run command failed"
            exit 1
          fi
      - name: Wait for container to be ready
        run: |
          echo "Waiting for staging container to be ready..."
          for i in {1..30}; do
            if docker ps | grep -q starter-app-staging; then
              if curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1; then
                echo "✅ Container is ready"
                exit 0
              fi
            else
              echo "Attempt $i/30: Container not running"
              docker ps -a | grep starter-app-staging || echo "Container not found"
            fi
            echo "Attempt $i/30: Waiting for container..."
            sleep 1
          done
          echo "❌ Container failed to start"
          docker logs starter-app-staging 2>&1 || echo "Could not retrieve logs"
          docker ps -a | grep starter-app-staging
          exit 1
      - name: Smoke test staging
        run: ./scripts/smoke.sh http://127.0.0.1:8000
      - name: Stop staging container
        if: always()
        run: docker rm -f starter-app-staging || true

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp
      - name: Load image
        run: |
          echo "Loading Docker image from artifact..."
          if docker load < /tmp/starter-app.tar.gz; then
            echo "✅ Image loaded successfully"
          else
            echo "❌ Failed to load image"
            exit 1
          fi
          echo "Available images:"
          docker images | grep starter-app || echo "No starter-app images found!"
      - name: Deploy to production
        run: ./scripts/deploy.sh production "${{ inputs.version }}"
      - name: Start production container
        run: |
          docker rm -f starter-app-production || true
          echo "Starting container with image: starter-app:${{ inputs.version }}"
          echo "Attempting docker run..."
          if docker run -d --rm --name starter-app-production -p 8001:8000 -e PORT=8000 -e APP_ENV=production "starter-app:${{ inputs.version }}"; then
            echo "✅ Docker run command succeeded"
            sleep 1
            echo "Checking if container is running..."
            if docker ps | grep -q starter-app-production; then
              echo "✅ Container is running"
              docker inspect starter-app-production | grep -A 5 Status
            else
              echo "❌ Container exited immediately"
              docker ps -a | grep starter-app-production
              docker logs starter-app-production 2>&1 || echo "No logs available"
              exit 1
            fi
          else
            echo "❌ Docker run command failed"
            exit 1
          fi
      - name: Wait for container to be ready
        run: |
          echo "Waiting for production container to be ready..."
          for i in {1..30}; do
            if docker ps | grep -q starter-app-production; then
              if curl -sf http://127.0.0.1:8001/health > /dev/null 2>&1; then
                echo "✅ Container is ready"
                exit 0
              fi
            else
              echo "Attempt $i/30: Container not running"
              docker ps -a | grep starter-app-production || echo "Container not found"
            fi
            echo "Attempt $i/30: Waiting for container..."
            sleep 1
          done
          echo "❌ Container failed to start"
          docker logs starter-app-production 2>&1 || echo "Could not retrieve logs"
          docker ps -a | grep starter-app-production
          exit 1
      - name: Smoke test production
        run: ./scripts/smoke.sh http://127.0.0.1:8001
      - name: Stop production container
        if: always()
        run: docker rm -f starter-app-production || true

  rollback:
    needs: production
    if: ${{ always() && needs.production.result == 'failure' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Roll back production marker
        run: ./scripts/rollback.sh production